<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338A8"/>
      <stop offset="1" stop-color="#1B1848"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6D1F7"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="256" height="256" rx="56" fill="url(#fundo)"/>

  <!-- Corpo: fantasma com a base ondulada e o formato de um mouse -->
  <path fill="url(#corpo)"
        d="M68,196 L68,118 C68,72 93,42 128,42 C163,42 188,72 188,118 L188,196
           a20,20 0 0 1 -40,0 a20,20 0 0 1 -40,0 a20,20 0 0 1 -40,0 Z"/>

  <!-- Detalhes de mouse: divisória dos botões e curva que separa os botões da palma -->
  <path d="M128,42 L128,104" stroke="#B9B2EE" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M70,106 Q128,122 186,106" stroke="#B9B2EE" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Roda de rolagem -->
  <rect x="120" y="58" width="16" height="30" rx="8" fill="#6C5CE7"/>
  <rect x="126" y="65" width="4" height="9" rx="2" fill="#FFFFFF" opacity="0.85"/>

  <!-- Olhos e boca -->
  <ellipse cx="105" cy="142" rx="9" ry="13" fill="#1B1848"/>
  <ellipse cx="151" cy="142" rx="9" ry="13" fill="#1B1848"/>
  <ellipse cx="128" cy="168" rx="6" ry="7.5" fill="#1B1848"/>
</svg>
